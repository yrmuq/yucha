name: Development build
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      include_flatpak:
        description: Include a standalone x86_64 Flatpak test bundle
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    concurrency:
      group: dev-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          include_flatpak: ${{ github.event_name == 'workflow_dispatch' && inputs.include_flatpak && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ github.sha }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    concurrency:
      group: distribution-upload
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Update existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release/draft.sh
