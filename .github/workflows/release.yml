# A merge commit from dev into main raises Y, sets Z to 0, and publishes
# that normal release. A squash or a direct commit does not.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cut:
    if: github.event.head_commit.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test release flow
        run: python3 -m unittest discover -s tests -p test_release.py -v

      - name: Prepare version tag
        id: tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          ver="$(bash packaging/release/cut.sh | tail -n 1)"
          case "$ver" in
            [0-9]*.[0-9]*.0) echo "version=${ver}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install file
        if: steps.tag.outputs.version != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y file binutils zsync pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv-dev

      - name: Build
        if: steps.tag.outputs.version != ''
        run: bash packaging/appimage/build.sh

      - name: Publish
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.tag.outputs.version }}"
          git push origin HEAD
          if [ "${{ steps.tag.outputs.refresh }}" = "true" ]; then
            git push origin \
              --force-with-lease="refs/tags/v${ver}:${{ steps.tag.outputs.previous_tag }}" \
              "refs/tags/v${ver}"
          else
            git push origin "refs/tags/v${ver}"
          fi
          bash packaging/release/publish.sh "v${ver}"

      - name: Sync published release into dev
        if: steps.tag.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash packaging/release/sync-dev.sh
