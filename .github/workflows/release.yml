# A merge commit from dev into main raises Y, sets Z to 0, and publishes
# that normal release. A squash or a direct commit does not.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: distribution-upload
  queue: max
  cancel-in-progress: false

jobs:
  cut:
    if: github.event.head_commit.id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test release flow
        run: python3 -m unittest discover -s tests -p test_release.py -v

      - name: Prepare version tag
        id: tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          ver="$(bash packaging/release/cut.sh | tail -n 1)"
          case "$ver" in
            [0-9]*.[0-9]*.0) echo "version=${ver}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        if: steps.tag.outputs.version != ''
        uses: ./.github/actions/build

      - name: Publish
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver="${{ steps.tag.outputs.version }}"
          git push origin HEAD
          git push origin "refs/tags/v${ver}"
          bash packaging/release/publish.sh "v${ver}"

      - name: Sync published release into dev
        if: steps.tag.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash packaging/release/sync-dev.sh

      - name: Refresh the dev draft
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev.yml --ref dev

  sync-deps:
    needs: cut
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve pending dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash packaging/release/sync-deps.sh
