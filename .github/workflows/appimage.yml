# An annotated tag vX.Y.Z builds the AppImage.
# X.Y.0 is a normal release. Any other X.Y.Z is a prerelease.
# The tag message is the release body.
# No run commands and no test-build banner. Those stay in the README.
# A manual run builds the image and does not publish a release.

name: AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: packaging/appimage/build/cache
          key: appimage-deps-20261013

      - name: Install file
        run: |
          sudo apt-get update
          sudo apt-get install -y file binutils
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv-dev

      - name: Build
        run: bash packaging/appimage/build.sh

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release/publish.sh "$GITHUB_REF_NAME"
