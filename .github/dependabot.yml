version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    open-pull-requests-limit: 1
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
